          format: uuid
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
        inviterName:
          type: string
          nullable: true
        email:
          type: string
          format: email
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WorkspacePermission"
        status:
          $ref: "#/components/schemas/InviteStatus"
