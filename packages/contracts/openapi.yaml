          format: uuid
        workspaceId:
          type: string
          format: uuid
        provider:
          $ref: "#/components/schemas/ChannelProvider"
        name:
          type: string
        status:
          $ref: "#/components/schemas/ChannelAccountStatus"
        shared:
          type: boolean
          description: >
            true for shared-bot channels managed by the RelayFlow platform;
            false for custom-bot channels where the workspace owner supplied their own token.
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    ContactResponse:
      type: object
      required: [id, workspaceId, createdAt, identities]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        identities:
          type: array
          items:
            $ref: "#/components/schemas/ExternalIdentityResponse"

    ContactDetailResponse:
      allOf:
        - $ref: "#/components/schemas/ContactResponse"

    ContactPageResponse:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContactResponse"
        hasMore:
          type: boolean
        nextCursor:
          type: string
          nullable: true

    ExternalIdentityResponse:
      type: object
      required: [id, workspaceId, contactId, provider, externalUserId, rawProfile, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        contactId:
          type: string
          format: uuid
        channelAccountId:
          type: string
          format: uuid
          nullable: true
        provider:
          $ref: "#/components/schemas/ChannelProvider"
        externalUserId:
          type: string
        externalConversationId:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        rawProfile:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    ConversationResponse:
      type: object
      required: [id, workspaceId, contactId, channelAccountId, channelProvider, status, lockedByWorkflow, lockedByAiAgent, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        contactId:
          type: string
          format: uuid
        contactDisplayName:
          type: string
          nullable: true
        channelAccountId:
          type: string
          format: uuid
        channelProvider:
          $ref: "#/components/schemas/ChannelProvider"
        channelAccountName:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ConversationStatus"
        lockedByWorkflow:
          type: boolean
          description: True while an active workflow run owns the conversation and agent replies are blocked.
        lockedByAiAgent:
          type: boolean
          description: True while the AI agent invocation pipeline is running for this conversation.
        assigneeId:
          type: string
          format: uuid
          nullable: true
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    ConversationPageResponse:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConversationResponse"
        hasMore:
          type: boolean
        nextCursor:
          type: string
          nullable: true

    MessageResponse:
      type: object
      required: [id, workspaceId, conversationId, direction, senderType, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        direction:
          $ref: "#/components/schemas/MessageDirection"
        senderType:
          $ref: "#/components/schemas/MessageSenderType"
        text:
          type: string
          nullable: true
        providerMessageId:
          type: string
          nullable: true
        rawPayload:
          type: object
          additionalProperties: true
          nullable: true
        createdAt:
          type: string
          format: date-time

    MessagePageResponse:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MessageResponse"
        hasMore:
          type: boolean
        nextCursor:
          type: string
          nullable: true

    # ── AI Agent ────────────────────────────────────────────────────────────────

    AutonomyCeiling:
      type: string
      enum: [DRAFT_ONLY, AUTO_SEND]
      description: >
        Controls how the AI agent acts on its response. `DRAFT_ONLY` always saves a
        draft for a human to review; `AUTO_SEND` sends replies directly when confidence
        is high.

    KnowledgeEntry:
      type: object
      required: [question, answer]
      properties:
        question:
          type: string
        answer:
          type: string

    WorkflowMapping:
      type: object
      required: [workflowId, name, triggerDescription]
      properties:
        workflowId:
          type: string
          format: uuid
        name:
          type: string
          description: Workflow display name (denormalized for display in config UI).
        triggerDescription:
          type: string
          description: Free-text description of when this workflow should be triggered (used in the agent system prompt).

    UpdateAiAgentConfigRequest:
      type: object
      required: [enabled, autonomyCeiling]
      properties:
        name:
          type: string
          maxLength: 100
          description: Display name for this agent configuration (shown in the AI Agent settings panel).
        enabled:
          type: boolean
        autonomyCeiling:
          $ref: "#/components/schemas/AutonomyCeiling"
        instructions:
          type: string
          nullable: true
          description: Freeform instructions injected into the agent system prompt.
        knowledgeBase:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeEntry"
        escalationKeywords:
          type: array
          items:
            type: string
          description: If any keyword matches the inbound message text the agent escalates immediately (Layer 1 fast-path).
        workflowMappings:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowMapping"

    AiAgentConfigResponse:
      type: object
      required: [id, workspaceId, name, enabled, autonomyCeiling, knowledgeBase, escalationKeywords, workflowMappings, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        name:
          type: string
          description: Display name for this agent configuration.
        enabled:
          type: boolean
        autonomyCeiling:
          $ref: "#/components/schemas/AutonomyCeiling"
        instructions:
          type: string
          nullable: true
        knowledgeBase:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeEntry"
        escalationKeywords:
          type: array
          items:
            type: string
        workflowMappings:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowMapping"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ConversationAiDraftResponse:
      type: object
      required: [id, workspaceId, conversationId, proposedReply, suggestedActions, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        invocationLogId:
          type: string
          format: uuid
          nullable: true
        proposedReply:
          type: string
        suggestedActions:
          type: array
          items:
            type: string
          description: >
            Actions the agent suggested alongside the draft.
            Values: `mark_resolved`, `trigger_workflow:<workflowId>`.
        createdAt:
          type: string
          format: date-time

    WorkflowDefinitionResponse:
      type: object
      required: [id, workspaceId, name, enabled, draftGraph, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        name:
          type: string
        enabled:
          type: boolean
        draftGraph:
          type: object
          description: React Flow-style workflow graph. Supported node types include trigger, sendMessage, condition, httpRequest, setVariable, waitForReply, jumpTo, and endConversation.
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
