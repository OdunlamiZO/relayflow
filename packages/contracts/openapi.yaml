        workspaceId:
          type: string
          format: uuid
        provider:
          $ref: "#/components/schemas/ChannelProvider"
        name:
          type: string
        status:
          $ref: "#/components/schemas/ChannelAccountStatus"
        metadata:
          type: object
          additionalProperties: true
        webhookUrl:
          type: string
          nullable: true
          description: The URL the provider delivers this channel's messages to.
        createdAt:
          type: string
          format: date-time

    ContactResponse:
      type: object
      required: [id, workspaceId, customFields, tags, createdAt, identities]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true
        customFields:
          type: object
          additionalProperties:
            type: string
          description: >-
            Explicitly-stored field values keyed by field key (reserved or
            workspace-defined). GET /contacts/{id} additionally merges in an
            auto-derived value for a reserved key that hasn't been explicitly set —
            see that operation's description.
        tags:
          type: object
          description: Tag key to value, limited to the workspace's tag definitions.
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        identities:
          type: array
          items:
            $ref: "#/components/schemas/ExternalIdentityResponse"

    ContactDetailResponse:
      allOf:
        - $ref: "#/components/schemas/ContactResponse"

    ContactPageResponse:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContactResponse"
        hasMore:
          type: boolean
        nextCursor:
          type: string
          nullable: true

    ExternalIdentityResponse:
      type: object
      required: [id, workspaceId, contactId, provider, externalUserId, rawProfile, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        contactId:
          type: string
          format: uuid
        channelAccountId:
          type: string
          format: uuid
          nullable: true
        provider:
          $ref: "#/components/schemas/ChannelProvider"
        externalUserId:
          type: string
        externalConversationId:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        rawProfile:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    ConversationResponse:
      type: object
      required: [id, workspaceId, contactId, channelAccountId, channelProvider, status, lockedByWorkflow, lockedByAiAgent, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        contactId:
          type: string
          format: uuid
        contactDisplayName:
          type: string
          nullable: true
        contactTags:
          type: object
          additionalProperties:
            type: string
        channelAccountId:
          type: string
          format: uuid
        channelProvider:
          $ref: "#/components/schemas/ChannelProvider"
        channelAccountName:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ConversationStatus"
        lockedByWorkflow:
          type: boolean
          description: True while an active workflow run owns the conversation and agent replies are blocked.
        lockedByAiAgent:
          type: boolean
          description: True while the AI agent invocation pipeline is running for this conversation.
        assigneeId:
          type: string
          format: uuid
          nullable: true
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
        escalatedAt:
          type: string
          format: date-time
          nullable: true
          description: Set while the AI agent has escalated the conversation to a human.
        escalationReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    ConversationPageResponse:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConversationResponse"
        hasMore:
          type: boolean
        nextCursor:
          type: string
          nullable: true

    MessageResponse:
      type: object
      required: [id, workspaceId, conversationId, direction, senderType, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        direction:
          $ref: "#/components/schemas/MessageDirection"
        senderType:
          $ref: "#/components/schemas/MessageSenderType"
        text:
          type: string
          nullable: true
        providerMessageId:
          type: string
          nullable: true
        rawPayload:
          type: object
          additionalProperties: true
          nullable: true
        createdAt:
          type: string
          format: date-time

    MessagePageResponse:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MessageResponse"
        hasMore:
          type: boolean
        nextCursor:
          type: string
          nullable: true

    # ── AI Agent ────────────────────────────────────────────────────────────────

    AutonomyCeiling:
      type: string
      enum: [DRAFT_ONLY, AUTO_SEND]
      description: >
        Controls how the AI agent acts on its response. `DRAFT_ONLY` always saves a
        draft for a human to review; `AUTO_SEND` sends replies directly when confidence
        is high.

    KnowledgeEntry:
      type: object
      required: [question, answer]
      properties:
        question:
          type: string
        answer:
          type: string

    WorkflowMapping:
      type: object
      required: [workflowId, name, triggerDescription]
      properties:
        workflowId:
          type: string
          format: uuid
        name:
          type: string
          description: Workflow display name (denormalized for display in config UI).
        triggerDescription:
          type: string
          description: Free-text description of when this workflow should be triggered (used in the agent system prompt).

    ExtractionField:
      type: object
      required: [key, description]
      properties:
        key:
          type: string
          description: Contact field key the extracted value is written to.
        description:
          type: string
          description: What the LLM should extract.
        validationHook:
          type: string
          nullable: true
          description: Key of a built-in or custom hook that checks the value before it's saved.

    UpdateAiAgentConfigurationRequest:
      type: object
      required: [enabled, autonomyCeiling]
      properties:
        name:
          type: string
          maxLength: 100
        enabled:
          type: boolean
        autonomyCeiling:
          $ref: "#/components/schemas/AutonomyCeiling"
        llmProvider:
          allOf:
            - $ref: "#/components/schemas/LlmProvider"
          nullable: true
          description: Null uses the instance default.
        instructions:
          type: string
          nullable: true
          description: Freeform instructions injected into the agent system prompt.
        knowledgeBase:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeEntry"
        escalationKeywords:
          type: array
          items:
            type: string
          description: If any keyword matches the inbound message text the agent escalates immediately.
        workflowMappings:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowMapping"
        extractionFields:
          type: array
          items:
            $ref: "#/components/schemas/ExtractionField"

    AiAgentConfigurationResponse:
      type: object
      required: [id, workspaceId, name, isDefault, enabled, autonomyCeiling, knowledgeBase, escalationKeywords, workflowMappings, extractionFields, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        name:
          type: string
        isDefault:
          type: boolean
          description: The workspace default handles channels without their own assignment.
        enabled:
          type: boolean
        autonomyCeiling:
          $ref: "#/components/schemas/AutonomyCeiling"
        llmProvider:
          allOf:
            - $ref: "#/components/schemas/LlmProvider"
          nullable: true
        instructions:
          type: string
          nullable: true
        knowledgeBase:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeEntry"
        escalationKeywords:
          type: array
          items:
            type: string
        workflowMappings:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowMapping"
        extractionFields:
          type: array
          items:
            $ref: "#/components/schemas/ExtractionField"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PlatformLlmProviderResponse:
      type: object
      required: [provider]
      properties:
        provider:
          $ref: "#/components/schemas/LlmProvider"

    ChannelAiAgentAssignmentResponse:
      type: object
      properties:
        configurationId:
          type: string
          format: uuid
          nullable: true
          description: Null means the channel uses the workspace default.

    ConversationAiDraftResponse:
      type: object
      required: [id, workspaceId, conversationId, proposedReply, suggestedActions, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        invocationLogId:
          type: string
          format: uuid
          nullable: true
        proposedReply:
          type: string
        suggestedActions:
          type: array
          items:
            type: string
          description: >
            Actions the agent suggested alongside the draft.
            Values: `mark_resolved`, `trigger_workflow:<workflowId>`.
        extractedData:
          type: object
          description: Values the agent extracted this turn, keyed by extraction field.
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time

    WorkflowDefinitionResponse:
      type: object
      required: [id, workspaceId, name, enabled, draftGraph, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        name:
          type: string
        enabled:
          type: boolean
        draftGraph:
          type: object
          description: >-
            React Flow-style workflow graph; see `schemas/workflow-definition.schema.json`. Node types:
            trigger, sendMessage, condition, httpRequest, setVariable, setContactField, setContactTag,
            waitForReply, jumpTo, and endConversation. Only published (`enabled`) workflows run.
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── Workflow Runs ──────────────────────────────────────────────────────────

    WorkflowRunStatus:
      type: string
      enum: [RUNNING, WAITING, COMPLETED, FAILED]
      description: >
        `WAITING` means the run is paused at a "Wait for Reply" node and resumes
        when the contact replies.

    WorkflowRunStepStatus:
      type: string
      enum: [COMPLETED, FAILED, SKIPPED]

    WorkflowRunNodeType:
      type: string
      enum:
        - TRIGGER
        - SEND_MESSAGE
        - CONDITION
        - HTTP_REQUEST
        - SET_VARIABLE
        - SET_CONTACT_FIELD
        - SET_CONTACT_TAG
        - END_CONVERSATION
        - WAIT_FOR_REPLY
        - JUMP_TO

    WorkflowRunStepResponse:
      type: object
      required: [id, nodeId, nodeType, status, inputSnapshot, outputSnapshot]
      properties:
        id:
          type: string
          format: uuid
        nodeId:
          type: string
          description: ID of the node within the workflow's draftGraph that this step executed.
        nodeType:
          $ref: "#/components/schemas/WorkflowRunNodeType"
        status:
          $ref: "#/components/schemas/WorkflowRunStepStatus"
        inputSnapshot:
          type: object
          additionalProperties: true
        outputSnapshot:
          type: object
          additionalProperties: true
        errorMessage:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        durationMs:
          type: integer
          format: int64
          nullable: true

    WorkflowRunResponse:
      type: object
      required: [id, workflowDefinitionId, conversationId, status]
      properties:
        id:
          type: string
          format: uuid
        workflowDefinitionId:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/WorkflowRunStatus"
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        errorMessage:
          type: string
          nullable: true
        waitingAtNodeId:
          type: string
          nullable: true
          description: ID of the "Wait for Reply" node the run is paused at; null unless status is WAITING.

    WorkflowRunDetailResponse:
      allOf:
        - $ref: "#/components/schemas/WorkflowRunResponse"
        - type: object
          required: [steps]
          properties:
            steps:
              type: array
              items:
                $ref: "#/components/schemas/WorkflowRunStepResponse"

    WorkflowRunPageResponse:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowRunResponse"
        hasMore:
          type: boolean
        nextCursor:
          type: string
          nullable: true
