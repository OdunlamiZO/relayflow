    PlanInfo:
      type: object
      required: [plan, upgradeAvailable]
      properties:
        plan:
          $ref: "#/components/schemas/Plan"
        maxChannelAccounts:
          type: integer
          nullable: true
          description: Maximum channel accounts allowed; null means unlimited.
        maxWorkflows:
          type: integer
          nullable: true
          description: Maximum workflow definitions allowed; null means unlimited.
        maxMembersPerWorkspace:
          type: integer
          nullable: true
          description: Maximum workspace members allowed; null means unlimited.
        priceNgn:
          type: number
          nullable: true
          description: Price in Nigerian naira for this plan's billing cycle; null for free plans.
        billingInterval:
          $ref: "#/components/schemas/BillingInterval"
          nullable: true
          description: Billing interval; null for free plans.
        upgradeAvailable:
          type: boolean

    SubscriptionResponse:
      type: object
      required: [plan, status, upgradeAvailable, upgradeRecommended]
      properties:
        plan:
          $ref: "#/components/schemas/Plan"
