spring.application.name=relayflow-api
spring.config.import=optional:classpath:.env[.properties]

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/relayflow}
spring.datasource.username=${DATABASE_USERNAME:relayflow}
spring.datasource.password=${DATABASE_PASSWORD:relayflow}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=false

server.port=8080

relayflow.web.base-url=${RELAYFLOW_WEB_BASE_URL:http://localhost:3000}
relayflow.api.base-url=${RELAYFLOW_API_BASE_URL:http://localhost:8080}
relayflow.marketing.base-url=${RELAYFLOW_MARKETING_BASE_URL:http://localhost:4000}
relayflow.auth.google.enabled=${GOOGLE_AUTH_ENABLED:false}
# Required — generate with: openssl rand -base64 32. The app refuses to start without it.
relayflow.encryption.key=${RELAYFLOW_ENCRYPTION_KEY:}

# Session cookie hardening
server.servlet.session.cookie.name=${SESSION_COOKIE_NAME:JSESSIONID}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}

# HTTP client timeouts (milliseconds)
relayflow.http.connect-timeout-ms=${RELAYFLOW_HTTP_CONNECT_TIMEOUT_MS:10000}
relayflow.http.read-timeout-ms=${RELAYFLOW_HTTP_READ_TIMEOUT_MS:20000}
relayflow.webhook.timeout-ms=${RELAYFLOW_WEBHOOK_TIMEOUT_MS:10000}

# Guest session lifecycle
relayflow.guest.expiry-hours=${RELAYFLOW_GUEST_EXPIRY_HOURS:24}

# Workspace invite lifecycle
relayflow.invite.expiry-days=${RELAYFLOW_INVITE_EXPIRY_DAYS:7}

# Rate limiting (Redis-backed fixed window) for auth, public API, and webhook endpoints
relayflow.ratelimit.enabled=${RATE_LIMIT_ENABLED:true}
relayflow.ratelimit.login.limit=${RATE_LIMIT_LOGIN_LIMIT:5}
relayflow.ratelimit.login.window-seconds=${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
relayflow.ratelimit.signup.limit=${RATE_LIMIT_SIGNUP_LIMIT:10}
relayflow.ratelimit.signup.window-seconds=${RATE_LIMIT_SIGNUP_WINDOW_SECONDS:3600}
# Public API (/public/v1/**), keyed by X-Api-Key
relayflow.ratelimit.public-api.limit=${RATE_LIMIT_PUBLIC_API_LIMIT:60}
relayflow.ratelimit.public-api.window-seconds=${RATE_LIMIT_PUBLIC_API_WINDOW_SECONDS:60}
# Inbound webhooks (Telegram, WhatsApp, Paystack), keyed by client IP
relayflow.ratelimit.webhook.limit=${RATE_LIMIT_WEBHOOK_LIMIT:120}
relayflow.ratelimit.webhook.window-seconds=${RATE_LIMIT_WEBHOOK_WINDOW_SECONDS:60}

# Workflow run log retention
relayflow.workflow.run-retention-days=${WORKFLOW_RUN_RETENTION_DAYS:90}

# AI agent invocation log retention
relayflow.agent.invocation-log-retention-days=${AGENT_INVOCATION_LOG_RETENTION_DAYS:90}

# LLM provider config (provider is set in Redis at platform:llm:provider — GROQ | ANTHROPIC | OPENAI | OLLAMA)
# Model per provider is set in Redis at platform:llm:{provider}:model
# Ollama URL is set in Redis at platform:llm:ollama:url (default: http://localhost:11434)
relayflow.llm.anthropic.api-key=${ANTHROPIC_API_KEY:}
relayflow.llm.openai.api-key=${OPENAI_API_KEY:}
relayflow.llm.groq.api-key=${GROQ_API_KEY:}

shared.telegram.bot-token=${SHARED_TELEGRAM_BOT_TOKEN:}
shared.telegram.webhook-secret=${SHARED_TELEGRAM_WEBHOOK_SECRET:}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:unused}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:unused}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# Set SWAGGER_ENABLED=false to disable API docs/Swagger UI outside of development.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Suppress broken-pipe noise from SSE clients that disconnect mid-stream
logging.level.org.apache.catalina.connector.CoyoteAdapter=OFF

# Email — Resend (https://resend.com)
# Leave blank for no-op mode (logs accept URL to console — useful for local development).
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:RelayFlow <noreply@relayflow.io>}

# Redis — plan configuration live-reload
# Plan limits and pricing are stored at relayflow:plan:{PLAN}:config as JSON.
# Update those keys at runtime to change limits without redeploying.
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# Paystack — Nigerian payment processing
# Leave blank to disable payment features (checkout + webhook) during local development.
paystack.secret-key=${PAYSTACK_SECRET_KEY:}
