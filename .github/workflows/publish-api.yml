name: Publish API image

# migrate is versioned and released together with api, not standalone.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v1.2.3, latest)"
        required: true
        default: latest

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile
          - name: migrate
            context: .
            dockerfile: ./infra/docker/flyway/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/relayflow-${{ matrix.name }}:${{ inputs.tag }}
          build-args: |
            RELAYFLOW_LICENSE_SIGNING_PUBLIC_KEY=${{ matrix.name == 'api' && secrets.RELAYFLOW_LICENSE_SIGNING_PUBLIC_KEY || '' }}
