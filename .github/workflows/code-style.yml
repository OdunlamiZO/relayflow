name: Code Style Check

on:
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Spotless check
        working-directory: apps/api
        run: mvn -B spotless:check -Pdevelopment

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Format check
        working-directory: apps/web
        run: npm run format:check

  marketing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/marketing/package-lock.json

      - name: Install dependencies
        working-directory: apps/marketing
        run: npm ci

      - name: Lint
        working-directory: apps/marketing
        run: npm run lint

      - name: Typecheck
        working-directory: apps/marketing
        run: npm run typecheck

      - name: Format check
        working-directory: apps/marketing
        run: npm run format:check
