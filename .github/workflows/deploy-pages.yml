name: Deploy marketing to GitHub Pages

# apps/marketing is a static Next.js export (see next.config.mjs), deployed
# straight to GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - "apps/marketing/**"
      - ".github/workflows/deploy-pages.yml"
      - "docker-compose.yml"
      - ".env.example"
      - "infra/docker/caddy/Caddyfile"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/marketing/package-lock.json

      - name: Install dependencies
        working-directory: apps/marketing
        run: npm ci

      - name: Build static export
        working-directory: apps/marketing
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/marketing/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
