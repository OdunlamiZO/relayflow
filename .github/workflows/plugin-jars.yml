name: Plugin JARs

# Attaches the plugin API and the official plugin JARs to a release after it is published.
# It never creates or edits a release.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build plugin JARs
        run: mvn -B -DskipTests package -pl packages/plugin-api,plugins/anthropic,plugins/openai-compatible,plugins/openai-compatible-transcription,plugins/local-disk-storage -am

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp packages/plugin-api/target/relayflow-plugin-api-*.jar relayflow-plugin-api.jar
          gh release upload "${{ github.event.release.tag_name }}" \
            relayflow-plugin-api.jar plugins/*/target/relayflow-plugin-*.jar --clobber
