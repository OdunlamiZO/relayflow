name: Publish images

# migrate publishes alongside api. All three images share one trigger so they always stay in version lockstep.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to re-publish (e.g. v1.2.3) — manual runs only"
        required: true
        default: latest

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    strategy:
      matrix:
        include:
          - name: api
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile
          - name: migrate
            context: .
            dockerfile: ./infra/docker/flyway/Dockerfile
          - name: web
            context: .
            dockerfile: ./apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/odunlamizo/relayflow-${{ matrix.name }}:${{ env.IMAGE_TAG }}
          build-args: |
            RELAYFLOW_LICENSE_SIGNING_PUBLIC_KEY=${{ matrix.name == 'api' && secrets.RELAYFLOW_LICENSE_SIGNING_PUBLIC_KEY || '' }}
